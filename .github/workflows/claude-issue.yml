name: Claude issue

# Runs the /issue flow (.claude/commands/issue.md) on GitHub issues:
# - an issue opened with, or later given, the `claude` label
# - a comment mentioning @claude on a `claude`-labelled issue (e.g. after
#   answering Claude's clarifying questions)
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.action == 'opened' &&
        contains(github.event.issue.labels.*.name, 'claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
        github.event.label.name == 'claude') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
        contains(github.event.issue.labels.*.name, 'claude') &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      MIX_ENV: test
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix compile

      - name: Configure git author
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/issue ${{ github.event.issue.number }}"
          claude_args: >-
            --allowedTools "Bash(mix:*),Bash(git:*),Bash(gh:*),Read,Write,Edit,Glob,Grep,Agent,Skill"
